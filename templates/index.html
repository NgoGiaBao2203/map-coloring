<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Map Coloring - Vietnam Mini (Python Backend)</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <h1>Map Coloring - Backtracking + Heuristic (Python)</h1>

    <div class="wrapper">
      <div id="mapBox">
        <div id="container">
          <svg width="500" height="700">
            <!-- Bản đồ -->
            <polygon
              id="A"
              class="region"
              points="220,40 300,50 280,110 200,100"
            />
            <text x="240" y="85" class="label">A</text>
            <polygon
              id="B"
              class="region"
              points="180,100 260,110 240,170 160,160"
            />
            <text x="200" y="145" class="label">B</text>
            <polygon
              id="C"
              class="region"
              points="260,110 340,120 320,180 240,170"
            />
            <text x="285" y="155" class="label">C</text>
            <polygon
              id="D"
              class="region"
              points="150,170 230,180 210,250 130,240"
            />
            <text x="170" y="215" class="label">D</text>
            <polygon
              id="E"
              class="region"
              points="230,180 310,190 290,260 210,250"
            />
            <text x="255" y="225" class="label">E</text>
            <polygon
              id="F"
              class="region"
              points="310,190 390,200 370,270 290,260"
            />
            <text x="335" y="235" class="label">F</text>
            <polygon
              id="G"
              class="region"
              points="170,250 250,260 230,330 150,320"
            />
            <text x="190" y="295" class="label">G</text>
            <polygon
              id="H"
              class="region"
              points="250,260 330,270 310,340 230,330"
            />
            <text x="275" y="305" class="label">H</text>
            <polygon
              id="J"
              class="region"
              points="230,330 310,340 290,410 210,400"
            />
            <text x="255" y="375" class="label">J</text>
            <polygon
              id="I"
              class="region"
              points="310,340 390,350 370,420 290,410"
            />
            <text x="335" y="385" class="label">I</text>
          </svg>
        </div>
      </div>

      <div id="panel">
        <div class="controls">
          <button class="solve" onclick="startSolve()">
            Giải bài toán bằng Python
          </button>
          <button class="reset" onclick="resetMap()">Reset</button>
        </div>
        <div class="small">
          Backend: Python Flask<br />
          Heuristic: Degree (Ưu tiên nhiều ràng buộc nhất)
        </div>
        <div id="log"></div>
      </div>
    </div>

    <script src="/static/script.js"></script>
  </body>
</html>
